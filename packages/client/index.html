<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rift Survivors</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      canvas {
        image-rendering: pixelated;
      }
      .levelup {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: rgba(0, 0, 0, 0.7);
        z-index: 10;
      }
      .levelup-title {
        color: #ffcc44;
        font-family: monospace;
        font-size: 22px;
        letter-spacing: 2px;
      }
      .levelup-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      .levelup-card {
        background: #16202e;
        border: 2px solid #3a5a7a;
        color: #fff;
        font-family: monospace;
        font-size: 14px;
        padding: 18px 20px;
        cursor: pointer;
        min-width: 130px;
      }
      .levelup-card:hover {
        border-color: #ffcc44;
      }
      .levelup-actions {
        display: flex;
        gap: 10px;
      }
      .levelup-action {
        background: #101a26;
        border: 2px solid #2a3a4a;
        color: #cfe0f0;
        font-family: monospace;
        font-size: 12px;
        letter-spacing: 1px;
        padding: 8px 12px;
        cursor: pointer;
      }
      .levelup-action:hover:not(:disabled) {
        border-color: #ffcc44;
      }
      .levelup-action:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .levelup-card.banish-target {
        border-color: #cc4444;
      }
      .levelup-card.banish-target:hover {
        border-color: #ff6666;
      }
      .levelup-card.training {
        border-color: #3fa9ff;
        color: #bfe3ff;
      }
      .levelup-hint {
        color: #7f93b0;
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 1px;
      }
      .charselect {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: rgba(0, 0, 0, 0.8);
        z-index: 20;
      }
      .charselect-title {
        color: #ffcc44;
        font-family: monospace;
        font-size: 20px;
        letter-spacing: 2px;
      }
      .charselect-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 90vw;
      }
      .charselect-card {
        background: #16202e;
        border: 2px solid #3a5a7a;
        color: #fff;
        font-family: monospace;
        font-size: 16px;
        padding: 24px 28px;
        cursor: pointer;
      }
      .charselect-card:hover {
        border-color: #ffcc44;
      }
      .charselect-name {
        font-size: 16px;
        color: #fff;
      }
      .charselect-ability {
        font-size: 10px;
        color: #8ab0c0;
        margin-top: 4px;
      }
      .meta {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #0d0f1a;
        color: #fff;
        font-family: monospace;
        z-index: 30;
        overflow: auto;
        padding: 20px;
      }
      .meta-header {
        font-size: 20px;
        color: #ffcc44;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }
      .meta-section {
        font-size: 13px;
        color: #7fb0e0;
        letter-spacing: 1px;
        margin-top: 8px;
      }
      .meta-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .meta-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .meta-label {
        min-width: 230px;
        font-size: 12px;
      }
      .meta-btn {
        background: #16202e;
        border: 2px solid #3a5a7a;
        color: #fff;
        font-family: monospace;
        font-size: 12px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .meta-btn:hover:not(:disabled) {
        border-color: #ffcc44;
      }
      .meta-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .meta-chip {
        font-size: 11px;
        padding: 3px 8px;
        border: 1px solid #3a5a7a;
        color: #5a6a7a;
      }
      .meta-chip.on {
        border-color: #44ff66;
        color: #44ff66;
      }
      .meta-play {
        margin-top: 14px;
        background: #16203a;
        border: 2px solid #44aa66;
        color: #fff;
        font-family: monospace;
        font-size: 18px;
        padding: 10px 40px;
        cursor: pointer;
      }
      .meta-play:hover {
        border-color: #ffcc44;
      }
      .run-end {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        font-family: monospace;
        z-index: 40;
      }
      .run-end-title {
        font-size: 26px;
        color: #ff4444;
      }
      .run-end-stats {
        font-size: 14px;
        white-space: pre-line;
        text-align: center;
      }
      .lobby {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0d0f1a;
        color: #fff;
        font-family: monospace;
        z-index: 30;
      }
      .lobby-title {
        font-size: 22px;
        color: #ffcc44;
        letter-spacing: 2px;
      }
      .lobby-input {
        background: #16202e;
        border: 2px solid #3a5a7a;
        color: #fff;
        font-family: monospace;
        font-size: 14px;
        padding: 6px 10px;
        width: 160px;
        text-align: center;
      }
      .lobby-status {
        font-size: 14px;
        color: #7fb0e0;
        min-height: 16px;
      }
      .name-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0d0f1a;
        color: #fff;
        font-family: monospace;
        z-index: 30;
      }
      .pause {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
        font-family: monospace;
        z-index: 45;
      }
      .pause-title {
        font-size: 26px;
        color: #ffcc44;
        letter-spacing: 2px;
        margin-bottom: 8px;
      }
      .pause-hint {
        font-size: 11px;
        color: #8ab0c0;
        margin-top: 10px;
      }
      .meta-hint {
        font-size: 11px;
        color: #7f93b0;
        margin-top: 6px;
        letter-spacing: 1px;
      }
      .debug-overlay {
        position: fixed;
        top: 6px;
        left: 6px;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.7);
        color: #7fffd4;
        font: 11px monospace;
        z-index: 50;
        pointer-events: none;
      }
      .connection-lost {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(24, 0, 0, 0.9);
        color: #fff;
        font-family: monospace;
        z-index: 60;
      }
      .banner {
        position: fixed;
        top: 22%;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 20px;
        color: #ffcc44;
        background: rgba(10, 14, 22, 0.88);
        border: 2px solid #ffcc44;
        font-family: monospace;
        font-size: 22px;
        letter-spacing: 4px;
        z-index: 25;
        pointer-events: none;
        opacity: 0;
      }
      .banner-show {
        animation: banner-pop 2.6s ease-out forwards;
      }
      .screen-flash {
        position: fixed;
        inset: 0;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
        z-index: 55;
      }
      .screen-flash.flash-on {
        animation: screen-flash 0.35s ease-out;
      }
      @keyframes screen-flash {
        0% { opacity: 0.75; }
        100% { opacity: 0; }
      }
      @keyframes banner-pop {
        0% { opacity: 0; transform: translateX(-50%) scale(0.85); }
        10% { opacity: 1; transform: translateX(-50%) scale(1.06); }
        20% { transform: translateX(-50%) scale(1); }
        75% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
    <style>
      /* ------------------------------------------------------------------ */
      /* Meta hub: League-client-inspired shell                             */
      /* ------------------------------------------------------------------ */
      :root {
        --rift-bg: #070b12;
        --rift-panel: #0d1420;
        --rift-panel-2: #111b2b;
        --rift-line: #24364b;
        --rift-gold: #d7b56d;
        --rift-gold-bright: #ffdf9b;
        --rift-text: #e8eef7;
        --rift-muted: #8ea3bb;
        --rift-teal: #52c7c0;
        --rift-danger: #e06b5f;
        --font-ui: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      }
      body {
        background: var(--rift-bg);
      }
      .meta {
        display: block;
        padding: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 78% 8%, rgba(62, 120, 180, 0.18), transparent 34%),
          radial-gradient(circle at 10% 100%, rgba(215, 181, 109, 0.08), transparent 36%),
          linear-gradient(160deg, #080d16, #05080f 70%);
        color: var(--rift-text);
        font-family: var(--font-ui);
      }
      .meta-shell {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .meta-topbar {
        height: 66px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 24px;
        border-bottom: 1px solid var(--rift-line);
        background: linear-gradient(180deg, rgba(14, 22, 35, 0.98), rgba(9, 14, 23, 0.96));
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      .meta-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 260px;
      }
      .meta-brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid var(--rift-gold);
        color: var(--rift-gold-bright);
        font-size: 20px;
        font-weight: bold;
        transform: rotate(45deg);
        background: linear-gradient(135deg, #1b2638, #0a1019);
      }
      .meta-brand-mark::first-letter {
        transform: rotate(-45deg);
      }
      .meta-brand-title {
        color: var(--rift-gold-bright);
        font-size: 18px;
        letter-spacing: 3px;
        font-weight: bold;
      }
      .meta-brand-sub {
        color: var(--rift-muted);
        font-size: 10px;
        letter-spacing: 3px;
      }
      .meta-currency {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .meta-currency-pill {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 12px;
        border: 1px solid var(--rift-line);
        background: #0b131f;
        color: #d8e3f2;
        font-size: 12px;
        letter-spacing: 1px;
      }
      .meta-currency-pill.accent {
        border-color: #6f5a2e;
        color: var(--rift-gold-bright);
      }
      .meta-currency-icon {
        color: var(--rift-gold);
      }
      .meta-topbar-champion {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 14px;
        border-left: 1px solid var(--rift-line);
        font-size: 12px;
        letter-spacing: 1px;
      }
      .meta-topbar-dot {
        width: 24px;
        height: 24px;
        border: 1px solid;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 11px;
        background: #0a111b;
      }
      .meta-admin-hint {
        color: #56677c;
        font-size: 10px;
        letter-spacing: 2px;
      }
      .meta-body {
        min-height: 0;
        flex: 1;
        display: flex;
      }
      .meta-sidebar {
        width: 236px;
        flex: none;
        border-right: 1px solid var(--rift-line);
        background: linear-gradient(180deg, rgba(12, 19, 30, 0.96), rgba(7, 11, 18, 0.98));
        display: flex;
        flex-direction: column;
        padding: 20px 14px 16px;
        gap: 18px;
      }
      .meta-sidebar-champion {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        border: 1px solid var(--rift-line);
        background: linear-gradient(135deg, color-mix(in srgb, var(--champ-color) 18%, #0c1420), #0a111b);
      }
      .meta-sidebar-portrait {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid var(--champ-color);
        color: var(--champ-color);
        font-size: 20px;
        background: #080d15;
      }
      .meta-sidebar-name {
        font-size: 13px;
        letter-spacing: 1px;
        color: #f2f6fc;
      }
      .meta-sidebar-region {
        margin-top: 3px;
        font-size: 10px;
        letter-spacing: 1px;
        color: var(--rift-muted);
      }
      .meta-nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .meta-nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 11px;
        border: 1px solid transparent;
        border-left: 2px solid transparent;
        background: transparent;
        color: #b4c3d5;
        font-family: var(--font-ui);
        text-align: left;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
      }
      .meta-nav-item:hover {
        background: rgba(83, 122, 164, 0.12);
        color: #fff;
      }
      .meta-nav-item.active {
        border-color: #2a4058;
        border-left-color: var(--rift-gold);
        background: linear-gradient(90deg, rgba(215, 181, 109, 0.14), rgba(20, 34, 52, 0.3));
        color: var(--rift-gold-bright);
      }
      .meta-nav-glyph {
        width: 22px;
        text-align: center;
        color: var(--rift-gold);
        font-size: 14px;
      }
      .meta-nav-copy {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .meta-nav-label {
        font-size: 11px;
        letter-spacing: 2px;
      }
      .meta-nav-hint {
        font-size: 9px;
        letter-spacing: 1px;
        color: #60758d;
      }
      .meta-sidebar-footer {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: #45566b;
        font-size: 9px;
        letter-spacing: 1px;
      }
      .meta-content {
        min-width: 0;
        flex: 1;
        overflow-y: auto;
        padding: 28px 34px 54px;
        scrollbar-color: #2a3f56 #0a1018;
      }
      .meta-page {
        max-width: 1180px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .meta-page-head {
        border-bottom: 1px solid var(--rift-line);
        padding-bottom: 14px;
      }
      .meta-kicker {
        color: var(--rift-gold);
        font-size: 10px;
        letter-spacing: 4px;
        margin-bottom: 4px;
      }
      .meta-title {
        margin: 0;
        font-size: 34px;
        line-height: 1;
        letter-spacing: 5px;
        color: #f3f7fd;
        font-weight: 600;
      }
      .meta-subtitle {
        margin-top: 8px;
        max-width: 800px;
        color: var(--rift-muted);
        font-size: 12px;
        line-height: 1.6;
      }
      .meta-hero {
        display: grid;
        grid-template-columns: 300px 1fr;
        border: 1px solid var(--rift-line);
        background:
          linear-gradient(120deg, color-mix(in srgb, var(--champ-color) 16%, #0c1522), #0a111b 56%),
          radial-gradient(circle at 16% 30%, color-mix(in srgb, var(--champ-color) 24%, transparent), transparent 40%);
        min-height: 330px;
        overflow: hidden;
      }
      .meta-hero-art {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border-right: 1px solid var(--rift-line);
        background:
          radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--champ-color) 35%, transparent), transparent 55%),
          linear-gradient(160deg, #0d1725, #070c14);
        overflow: hidden;
      }
      .meta-hero-art::before {
        content: "";

        inset: 22px;
        border: 1px solid color-mix(in srgb, var(--champ-color) 42%, transparent);
        transform: rotate(45deg);
        opacity: 0.55;
      }
      .meta-hero-halo {
        width: 150px;

        display: grid;
        place-items: center;
        border: 1px solid var(--champ-color);

        font-size: 70px;
        text-shadow: 0 0 42px color-mix(in srgb, var(--champ-color) 70%, transparent);
        background: radial-gradient(circle, color-mix(in srgb, var(--champ-color) 18%, transparent), transparent 68%);

      .meta-hero-art-label {
        position: absolute;

      .meta-hero-copy {
        padding: 28px 30px;

        background: #0a121c;
        color: #869bb1;
        padding: 8px 12px;
        font-family: var(--font-ui);
        font-size: 10px;
        letter-spacing: 1px;
        cursor: pointer;
      }
      .meta-toggle.on {
        color: #c7f2d9;
        border-color: #3e6e55;
      }
      .meta-toggle-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #40556a;
      }
      .meta-toggle.on .meta-toggle-dot {
        background: #65d48c;
        box-shadow: 0 0 8px rgba(101, 212, 140, 0.5);
      }
      .meta-hint {
        font-size: 9px;
        color: #6e8196;
        letter-spacing: 1px;
      }

      /* ------------------------------------------------------------------ */
      /* In-game HUD                                                        */
      /* ------------------------------------------------------------------ */
      .hud {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        color: #e9f0f8;
        font-family: var(--font-ui);
        user-select: none;
      }
      .hud-topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 38px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        background: linear-gradient(180deg, rgba(5, 9, 15, 0.9), rgba(5, 9, 15, 0.35) 70%, transparent);
      }
      .hud-center {
        position: absolute;
        left: 50%;
        top: 6px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .hud-time {
        color: #f1f6fd;
        font-size: 17px;
        letter-spacing: 2px;
        text-shadow: 0 1px 3px #000;
      }
      .hud-kills {
        display: flex;
        align-items: baseline;
        gap: 5px;
        border-left: 1px solid rgba(140, 170, 200, 0.35);
        padding-left: 12px;
      }
      .hud-kills-label {
        color: #8fa8c0;
        font-size: 8px;
        letter-spacing: 2px;
      }
      .hud-kills-value {
        color: #ffd98a;
        font-size: 13px;
        letter-spacing: 1px;
      }
      .hud-currency {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 10px;
        letter-spacing: 1px;
        text-shadow: 0 1px 2px #000;
      }
      .hud-stage-name {
        color: #7f98ae;
        font-size: 8px;
        letter-spacing: 1.5px;
        margin-right: 6px;
      }
      .hud-gold { color: #ffd98a; }
      .hud-chests { color: #c8b0ff; }
      .hud-party {
        position: absolute;
        top: 48px;
        left: 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        width: 180px;
      }
      .hud-party-frame {
        display: flex;
        align-items: center;
        gap: 6px;
        background: linear-gradient(90deg, rgba(7, 12, 19, 0.9), rgba(7, 12, 19, 0.55));
        border-left: 2px solid #3c5c77;
        padding: 5px 6px;
      }
      .hud-party-dot {
        width: 24px;
        height: 24px;
        flex: none;
        display: grid;
        place-items: center;
        border: 1px solid;
        border-radius: 50%;
        background: #070c13;
        font-size: 10px;
      }
      .hud-party-info {
        min-width: 0;
        flex: 1;
      }
      .hud-party-name {
        color: #e6eef8;
        font-size: 10px;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hud-party-sub {
        color: #8098b0;
        font-size: 7px;
        letter-spacing: 0.5px;
        margin-top: 1px;
      }
      .hud-party-sub.down { color: #ff7d73; }
      .hud-party-hp-track {
        height: 3px;
        margin-top: 3px;
        background: #172533;
      }
      .hud-party-hp-fill {
        height: 100%;
      }
      .hud-boss {
        position: absolute;
        top: 46px;
        left: 50%;
        transform: translateX(-50%);
        width: 330px;
        text-align: center;
      }
      .hud-boss-name {
        color: #ffd98a;
        font-size: 10px;
        letter-spacing: 2px;
        text-shadow: 0 1px 3px #000;
      }
      .hud-boss-name.final {
        color: #e2a5ff;
      }
      .hud-boss-track {
        height: 7px;
        margin-top: 3px;
        background: rgba(4, 8, 13, 0.85);
        border: 1px solid rgba(140, 170, 200, 0.28);
      }
      .hud-boss-fill {
        height: 100%;
        background: linear-gradient(90deg, #b34034, #ff7d5b);
        transition: width 90ms linear;
      }
      .hud-boss-fill.final {
        background: linear-gradient(90deg, #6b2e9b, #d47cff);
      }
      .hud-hotbar {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        background: linear-gradient(180deg, rgba(12, 20, 31, 0.94), rgba(5, 9, 15, 0.97));
        border: 1px solid #32495f;
        box-shadow: 0 6px 26px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(160, 195, 225, 0.08);
      }
      .hud-identity {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hud-portrait {
        width: 42px;
        height: 42px;
        position: relative;
        display: grid;
        place-items: center;
        color: #071018;
        font-size: 20px;
        font-weight: bold;
        border: 1px solid #c9d5e2;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      .hud-level-badge {
        position: absolute;
        right: -5px;
        bottom: -5px;
        min-width: 17px;
        height: 17px;
        display: grid;
        place-items: center;
        background: #0a111b;
        border: 1px solid var(--rift-gold);
        color: var(--rift-gold-bright);
        font-size: 9px;
        padding: 0 3px;
      }
      .hud-bars {
        width: 150px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .hud-hp-track {
        position: relative;
        height: 14px;
        background: #120b0b;
        border: 1px solid #3c2b2b;
        overflow: hidden;
      }
      .hud-hp-fill {
        height: 100%;
        background: linear-gradient(180deg, #53d67e, #1f9b4f);
        transition: width 80ms linear;
      }
      .hud-hp-text {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #effff5;
        font-size: 8px;
        text-shadow: 0 1px 2px #000;
        letter-spacing: 0.5px;
      }
      .hud-xp-track {
        height: 6px;
        background: #0b1622;
        border: 1px solid #233b50;
        overflow: hidden;
      }
      .hud-xp-fill {
        height: 100%;
        background: linear-gradient(90deg, #2d7fc4, #65cfff);
        transition: width 80ms linear;
      }
      .hud-slots {
        display: grid;
        grid-template-columns: repeat(4, 30px);
        gap: 3px;
      }
      .hud-moves {
        padding-left: 8px;
        border-left: 1px solid #2e4357;
      }
      .hud-items {
        display: grid;
        grid-template-columns: repeat(4, 18px);
        gap: 2px;
        padding-left: 8px;
        border-left: 1px solid #2e4357;
      }
      .hud-slot {
        position: relative;
        width: 30px;
        height: 30px;
        overflow: hidden;
        border: 1px solid #32485e;
        background: #0c1621;
        cursor: default;
      }
      .hud-slot-small {
        width: 18px;
        height: 18px;
      }
      .hud-slot-move {
        border-color: #6f5a2e;
      }
      .hud-slot-empty {
        background: #0a1119;
        border-color: #22313f;
      }
      .hud-slot-letter {
        position: absolute;
        top: 1px;
        left: 2px;
        color: #c4d3e2;
        font-size: 7px;
        z-index: 2;
        text-shadow: 0 1px 2px #000;
      }
      .hud-slot-glyph {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 14px;
        color: #f3f7fc;
        text-shadow: 0 1px 3px #000;
        z-index: 1;
      }
      .hud-slot-small .hud-slot-glyph {
        font-size: 10px;
      }
      .hud-slot-small .hud-slot-letter {
        display: none;
      }
      .hud-slot-level {
        position: absolute;
        right: 1px;
        bottom: 0;
        color: #ffe4a4;
        font-size: 7px;
        z-index: 3;
        text-shadow: 0 1px 2px #000;
      }
      .hud-slot-cooldown {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 0%;
        background: rgba(0, 0, 0, 0.68);
        z-index: 2;
        transition: height 80ms linear;
        pointer-events: none;
      }
      .hud-tooltip {
        position: fixed;
        width: 250px;
        background: linear-gradient(160deg, rgba(10, 17, 26, 0.98), rgba(5, 9, 14, 0.98));
        border: 1px solid #3c5870;
        padding: 10px 12px;
        z-index: 80;
        pointer-events: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
      .hud-tooltip-title {
        font-size: 14px;
        letter-spacing: 1px;
      }
      .hud-tooltip-sub {
        color: var(--rift-gold);
        font-size: 8px;
        letter-spacing: 1.5px;
        margin-top: 3px;
      }
      .hud-tooltip-desc {
        color: #98adc2;
        font-size: 10px;
        line-height: 1.5;
        margin-top: 7px;
      }
      .hud-tooltip-lines {
        margin-top: 8px;
        border-top: 1px solid #24384c;
        padding-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .hud-tooltip-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 9px;
        color: #dce8f5;
      }
      .hud-tooltip-label {
        color: #7890a7;
        letter-spacing: 0.5px;
      }
      .hud-scoreboard {
        position: fixed;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        width: min(760px, 92vw);
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        z-index: 8;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 15px;
        background: linear-gradient(160deg, rgba(11, 18, 28, 0.98), rgba(6, 10, 16, 0.98));
        border: 1px solid #3a536a;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.65);
      }
      .hud-score-title {
        color: var(--rift-gold-bright);
        font-size: 14px;
        letter-spacing: 3px;
      }
      .hud-score-hint {
        position: absolute;
        top: 16px;
        right: 16px;
        color: #60768b;
        font-size: 8px;
        letter-spacing: 1px;
      }
      .hud-score-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .hud-score-row {
        display: grid;
        grid-template-columns: 1.3fr 1fr 0.5fr 1fr 0.6fr 0.8fr;
        gap: 8px;
        padding: 6px 8px;
        border-bottom: 1px solid #1d2e3f;
        color: #c1d0e0;
        font-size: 10px;
      }
      .hud-score-row.you {
        background: rgba(215, 181, 109, 0.08);
        color: #f5e7c5;
      }
      .hud-score-head {
        color: #72879c;
        font-size: 8px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .hud-score-stats {
        border-top: 1px solid #2a3d50;
        padding-top: 10px;
      }
      .hud-stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px 14px;
      }
      .hud-stat-cell {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid #182635;
        padding: 3px 0;
        font-size: 9px;
      }
      .hud-stat-label {
        color: #73899f;
        letter-spacing: 0.5px;
      }
      .hud-stat-value {
        color: #e8f0f8;
      }
      .hud-score-footer {
        margin-top: 8px;
        color: #a9b9ca;
        font-size: 9px;
        letter-spacing: 1px;
      }

      /* ------------------------------------------------------------------ */
      /* Level-up cards                                                     */
      /* ------------------------------------------------------------------ */
      .levelup {
        background:
          radial-gradient(circle at 50% 38%, rgba(29, 47, 71, 0.55), transparent 55%),
          rgba(2, 4, 8, 0.86);
        backdrop-filter: blur(3px);
        gap: 14px;
      }
      .levelup-heading {
        text-align: center;
      }
      .levelup-eyebrow {
        color: var(--rift-gold);
        font-family: var(--font-ui);
        font-size: 9px;
        letter-spacing: 5px;
      }
      .levelup-title {
        color: #f7f2e6;
        font-family: var(--font-ui);
        font-size: 30px;
        letter-spacing: 7px;
        margin-top: 3px;
      }
      .levelup-row {
        gap: 10px;
        max-width: 1120px;
      }
      .levelup-card {
        --card-color: #5fb8ff;
        position: relative;
        width: 232px;
        min-height: 286px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        text-align: left;
        padding: 13px;
        background:
          radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--card-color) 16%, transparent), transparent 38%),
          linear-gradient(170deg, #111c29, #080e16);
        border: 1px solid color-mix(in srgb, var(--card-color) 48%, #2a3d50);
        color: #e8f0f8;
        font-family: var(--font-ui);
        cursor: pointer;
        transition: transform 110ms ease, border-color 110ms ease, box-shadow 110ms ease;
      }
      .levelup-card:hover {
        transform: translateY(-3px);
        border-color: var(--card-color);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5), 0 0 20px color-mix(in srgb, var(--card-color) 14%, transparent);
      }
      .levelup-card.training {
        --card-color: #3fa9ff;
        background: linear-gradient(170deg, #0f1d2b, #080e16);
      }
      .levelup-card-top {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .levelup-icon {
        width: 40px;
        height: 40px;
        flex: none;
        display: grid;
        place-items: center;
        border: 1px solid var(--card-color);
        color: var(--card-color);
        background: radial-gradient(circle, color-mix(in srgb, var(--card-color) 18%, transparent), #080e16 70%);
        font-size: 19px;
        text-shadow: 0 0 12px color-mix(in srgb, var(--card-color) 55%, transparent);
      }
      .levelup-meta {
        min-width: 0;
      }
      .levelup-badge {
        color: var(--card-color);
        font-size: 8px;
        letter-spacing: 2px;
      }
      .levelup-name {
        font-size: 15px;
        letter-spacing: 0.5px;
        color: #f5f8fc;
        line-height: 1.15;
      }
      .levelup-subtitle {
        color: #9cb0c5;
        font-size: 8px;
        letter-spacing: 1px;
        border-bottom: 1px solid #223447;
        padding-bottom: 6px;
      }
      .levelup-desc {
        color: #8fa4ba;
        font-size: 10px;
        line-height: 1.5;
        min-height: 45px;
      }
      .levelup-lines {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-top: auto;
        border-top: 1px solid #1e3042;
        padding-top: 6px;
      }
      .levelup-line {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 9px;
      }
      .levelup-line-label {
        color: #71879d;
        letter-spacing: 0.5px;
      }
      .levelup-line-value {
        color: #eaf2fa;
        text-align: right;
      }
      .levelup-training-hint {
        margin-top: auto;
        color: #6485a4;
        font-size: 9px;
      }
      .levelup-pick {
        margin-top: 4px;
        color: var(--card-color);
        font-size: 8px;
        letter-spacing: 2px;
      }
      .levelup-actions {
        gap: 7px;
      }
      .levelup-action {
        border: 1px solid #2f455a;
        background: #0b131d;
        color: #b8c9db;
        font-family: var(--font-ui);
        font-size: 9px;
        letter-spacing: 1.5px;
        padding: 7px 11px;
      }
      .levelup-action:hover:not(:disabled) {
        border-color: var(--rift-gold);
        color: var(--rift-gold-bright);
      }
      .levelup-hint {
        color: #677c92;
        font-family: var(--font-ui);
        font-size: 8px;
        letter-spacing: 1.5px;
      }
      .levelup-card.banish-target {
        border-color: #b14e45;
      }

      /* ------------------------------------------------------------------ */
      /* Admin panel                                                        */
      /* ------------------------------------------------------------------ */
      .admin {
        position: fixed;
        inset: 0;
        z-index: 120;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(2, 5, 9, 0.72);
        backdrop-filter: blur(2px);
      }
      .admin-panel {
        width: min(620px, 92vw);
        background: linear-gradient(160deg, #111b27, #080d14);
        border: 1px solid #8d6b30;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.7);
        padding: 18px;
      }
      .admin-title {
        color: var(--rift-gold-bright);
        font-family: var(--font-ui);
        font-size: 16px;
        letter-spacing: 4px;
      }
      .admin-hint {
        margin-top: 4px;
        color: #7a8ea3;
        font-family: var(--font-ui);
        font-size: 8px;
        letter-spacing: 1px;
      }
      .admin-grid {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 6px;
      }
      .admin-btn {
        border: 1px solid #33495e;
        background: #0a111b;
        color: #d2e0ee;
        font-family: var(--font-ui);
        font-size: 10px;
        letter-spacing: 1px;
        padding: 9px 10px;
        text-align: left;
        cursor: pointer;
      }
      .admin-btn:hover {
        border-color: var(--rift-gold);
        color: var(--rift-gold-bright);
      }
      .admin-status {
        margin-top: 12px;
        padding-top: 9px;
        border-top: 1px solid #26384a;
        color: #6fcf9a;
        font-family: var(--font-ui);
        font-size: 9px;
        letter-spacing: 1px;
      }
      @media (max-width: 900px) {
        .meta-sidebar { width: 190px; }
        .meta-content { padding: 20px 18px 44px; }
        .meta-hero { grid-template-columns: 1fr; }
        .meta-hero-art { min-height: 180px; border-right: 0; border-bottom: 1px solid var(--rift-line); }
        .meta-kit { grid-template-columns: 1fr; }
        .meta-region-grid { grid-template-columns: 1fr; }
        .meta-stat-strip { grid-template-columns: repeat(2, 1fr); }
        .meta-brand { min-width: 0; }
        .meta-brand-copy { display: none; }
        .meta-topbar { gap: 10px; padding: 0 12px; }
        .meta-currency-pill { padding: 5px 8px; font-size: 10px; }
        .meta-topbar-champion { display: none; }
        .meta-nav-hint { display: none; }
      }

      /* ------------------------------------------------------------------ */
      /* Champion identity: region crests, dossier, reactive surfaces        */
      /* ------------------------------------------------------------------ */
      .meta-crest-stack {
        position: relative;
        display: grid;
        place-items: center;
        isolation: isolate;
        pointer-events: none;
      }
      .meta-crest-stack::before {
        content: "";
        position: absolute;
        inset: 8%;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          color-mix(in srgb, var(--region-primary) 28%, transparent),
          transparent 68%
        );
        filter: blur(10px);
        z-index: -1;
      }
      .meta-region-crest {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter:
          drop-shadow(0 0 1px rgba(240, 230, 210, 0.5))
          drop-shadow(0 8px 12px rgba(0, 0, 0, 0.55));
      }
      .meta-crest-stack[data-count="1"] .meta-region-crest {
        position: relative;
      }
      .meta-crest-stack[data-count="2"] .meta-region-crest:nth-child(1) {
        transform: translateX(-17%) scale(0.86);
      }
      .meta-crest-stack[data-count="2"] .meta-region-crest:nth-child(2) {
        transform: translateX(17%) scale(0.86);
        opacity: 0.86;
      }
      .meta-crest-stack[data-count="3"] .meta-region-crest:nth-child(1) {
        transform: translate(-22%, 8%) scale(0.72);
      }
      .meta-crest-stack[data-count="3"] .meta-region-crest:nth-child(2) {
        transform: translate(0, -13%) scale(0.78);
      }
      .meta-crest-stack[data-count="3"] .meta-region-crest:nth-child(3) {
        transform: translate(22%, 8%) scale(0.72);
        opacity: 0.84;
      }
      .meta-crest-stack[data-count="4"] .meta-region-crest {
        transform: scale(0.68);
      }
      .meta-crest-stack[data-count="4"] .meta-region-crest:nth-child(1) {
        translate: -22% -18%;
      }
      .meta-crest-stack[data-count="4"] .meta-region-crest:nth-child(2) {
        translate: 22% -18%;
      }
      .meta-crest-stack[data-count="4"] .meta-region-crest:nth-child(3) {
        translate: -22% 18%;
      }
      .meta-crest-stack[data-count="4"] .meta-region-crest:nth-child(4) {
        translate: 22% 18%;
      }
      .meta-champion-crest {
        position: absolute;
        z-index: 0;
        right: -14px;
        top: 3px;
        width: 118px;
        height: 118px;
        opacity: 0.27;
        filter: sepia(0.25) saturate(1.2) brightness(1.18);
        transition: opacity 220ms ease, transform 300ms ease;
      }
      .meta-champion-card:hover .meta-champion-crest,
      .meta-champion-card:focus-visible .meta-champion-crest {
        opacity: 0.44;
        transform: scale(1.04);
      }
      .meta-champion-card {
        position: relative;
        overflow: hidden;
        cursor: pointer;
        isolation: isolate;
        background:
          radial-gradient(
            circle at 100% 0%,
            color-mix(in srgb, var(--region-primary) 18%, transparent),
            transparent 42%
          ),
          radial-gradient(
            circle at 0% 100%,
            color-mix(in srgb, var(--region-secondary) 11%, transparent),
            transparent 44%
          ),
          linear-gradient(160deg, #101a28, #0a111b);
      }
      .meta-champion-card::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        opacity: 0;
        background: radial-gradient(
          circle 170px at var(--mx, 50%) var(--my, 0%),
          color-mix(in srgb, var(--region-primary) 18%, transparent),
          transparent 70%
        );
        transition: opacity 220ms ease;
        pointer-events: none;
      }
      .meta-champion-card:hover::before,
      .meta-champion-card:focus-visible::before {
        opacity: 1;
      }
      .meta-champion-card > *:not(.meta-champion-crest) {
        position: relative;
        z-index: 1;
      }
      .meta-champion-card:focus-visible {
        outline: 1px solid var(--rift-gold-bright);
        outline-offset: 2px;
      }
      .meta-champion-card.locked {
        opacity: 0.9;
      }
      .meta-champion-card.locked:hover {
        opacity: 1;
        border-color: color-mix(in srgb, var(--region-primary) 55%, #2d4358);
      }
      .meta-champion-initial {
        font-size: 24px;
        color: var(--champ-color);
        text-shadow: 0 0 12px color-mix(in srgb, var(--champ-color) 55%, transparent);
      }
      .meta-champion-title {
        margin-top: 2px;
        color: var(--rift-gold-bright);
        font-size: 9px;
        letter-spacing: 0.8px;
        text-transform: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta-champion-region {
        margin-top: 3px;
        color: #9fb3c9;
        font-size: 8px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta-cross-region {
        align-self: flex-start;
        border: 1px solid color-mix(in srgb, var(--region-secondary) 70%, #5b6f9f);
        color: color-mix(in srgb, var(--region-secondary) 80%, #e7d9b0);
        padding: 2px 5px;
        font-size: 7px;
        letter-spacing: 0.8px;
        white-space: nowrap;
      }
      .meta-open-hint {
        color: #5f7488;
        font-size: 7px;
        letter-spacing: 1px;
      }
      .meta-champion-card:hover .meta-open-hint {
        color: var(--rift-gold-bright);
      }
      .meta-region-chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
      }
      .meta-region-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        border: 1px solid color-mix(in srgb, var(--region-color) 70%, #2b4058);
        color: color-mix(in srgb, var(--region-color) 70%, #f3f7fc);
        background: color-mix(in srgb, var(--region-color) 7%, transparent);
        padding: 3px 7px;
        font-size: 8px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .meta-region-chip.primary {
        background: color-mix(in srgb, var(--region-color) 14%, transparent);
      }
      .meta-region-chip.primary::before {
        content: "\25cf";
        font-size: 6px;
        color: var(--region-color);
      }
      .meta-sidebar-title {
        margin-top: 2px;
        color: var(--rift-gold-bright);
        font-size: 9px;
        letter-spacing: 0.4px;
      }
      .meta-hero-title {
        color: var(--rift-gold-bright);
        font-size: 13px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }
      .meta-hero-crest {
        position: absolute;
        width: 290px;
        height: 290px;
        opacity: 0.24;
        filter: sepia(0.2);
        z-index: 0;
      }
      .meta-hero-art > *:not(.meta-hero-crest) {
        position: relative;
        z-index: 1;
      }
      .meta-region-head {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr);
        column-gap: 10px;
        align-items: center;
      }
      .meta-region-crest-box {
        grid-row: 1 / span 2;
        grid-column: 1;
        width: 48px;
        height: 48px;
        margin: 0;
        opacity: 0.9;
      }
      .meta-region-head .meta-region-name,
      .meta-region-head .meta-region-blurb {
        grid-column: 2;
      }

      /* Full champion dossier ------------------------------------------------ */
      .meta-dossier {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 24px;
        --region-primary: #c8aa6e;
        --region-secondary: #2b4f78;
        --region-tertiary: #5a2020;
      }
      .meta-dossier-backdrop {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 20%, rgba(23, 41, 60, 0.32), transparent 50%),
          rgba(3, 7, 12, 0.82);
        backdrop-filter: blur(5px);
      }
      .meta-dossier-panel {
        position: relative;
        width: min(1120px, 100%);
        max-height: min(880px, calc(100vh - 48px));
        overflow: auto;
        border: 1px solid color-mix(in srgb, var(--region-primary) 55%, #31465b);
        background:
          radial-gradient(
            circle at 14% 3%,
            color-mix(in srgb, var(--region-primary) 22%, transparent),
            transparent 36%
          ),
          radial-gradient(
            circle at 96% 92%,
            color-mix(in srgb, var(--region-secondary) 14%, transparent),
            transparent 44%
          ),
          linear-gradient(140deg, #101b28, #080e16 70%);
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.65),
          inset 0 0 0 1px rgba(215, 181, 109, 0.08);
        animation: meta-dossier-in 220ms ease-out;
      }
      @keyframes meta-dossier-in {
        from { opacity: 0; transform: translateY(8px) scale(0.99); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .meta-dossier-close {
        position: absolute;
        z-index: 3;
        top: 12px;
        right: 14px;
        width: 32px;
        height: 32px;
        border: 1px solid #41566b;
        background: rgba(5, 11, 17, 0.72);
        color: #dce8f4;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }
      .meta-dossier-close:hover {
        border-color: var(--rift-gold);
        color: var(--rift-gold-bright);
      }
      .meta-dossier-hero {
        display: grid;
        grid-template-columns: 300px 1fr;
        min-height: 295px;
        border-bottom: 1px solid #2b4054;
      }
      .meta-dossier-art {
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-right: 1px solid #2b4054;
        background:
          radial-gradient(
            circle at 50% 48%,
            color-mix(in srgb, var(--region-primary) 26%, transparent),
            transparent 55%
          ),
          linear-gradient(
            135deg,
            color-mix(in srgb, var(--region-primary) 12%, #0a111b),
            #080e16
          );
      }
      .meta-dossier-art::before {
        content: "";
        position: absolute;
        width: 210px;
        height: 210px;
        border: 1px solid color-mix(in srgb, var(--region-primary) 35%, transparent);
        transform: rotate(45deg);
        opacity: 0.55;
      }
      .meta-dossier-art::after {
        content: "";
        position: absolute;
        inset: 34px;
        border: 1px solid color-mix(in srgb, var(--region-secondary) 28%, transparent);
        border-radius: 50%;
        opacity: 0.5;
      }
      .meta-dossier-crest {
        width: 230px;
        height: 230px;
        z-index: 1;
        filter: drop-shadow(0 0 18px color-mix(in srgb, var(--region-primary) 35%, transparent));
      }
      .meta-dossier-art-label {
        position: absolute;
        left: 20px;
        bottom: 16px;
        z-index: 2;
        color: color-mix(in srgb, var(--region-primary) 78%, #e8f1fa);
        font-size: 9px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .meta-dossier-heading {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 42px 54px 32px 36px;
      }
      .meta-dossier-title {
        color: var(--rift-gold-bright);
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .meta-dossier-name {
        margin: 0;
        color: #fff;
        font-size: clamp(34px, 4vw, 55px);
        font-weight: 500;
        line-height: 0.95;
        letter-spacing: 2px;
        text-shadow: 0 0 24px color-mix(in srgb, var(--region-primary) 22%, transparent);
      }
      .meta-dossier-role-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .meta-dossier-body {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(250px, 0.75fr);
        gap: 26px;
        padding: 28px 34px 32px;
      }
      .meta-dossier-column {
        display: flex;
        flex-direction: column;
        gap: 22px;
        min-width: 0;
      }
      .meta-dossier-summary {
        border-left: 2px solid var(--region-primary);
        padding-left: 14px;
      }
      .meta-dossier-summary p {
        margin: 7px 0 0;
        color: #c7d5e5;
        font-size: 14px;
        line-height: 1.65;
      }
      .meta-dossier-facts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        background: #24384c;
        border: 1px solid #24384c;
      }
      .meta-dossier-fact {
        min-height: 58px;
        background: #0b1420;
        padding: 11px 13px;
      }
      .meta-dossier-fact:last-child:nth-child(odd) {
        grid-column: 1 / -1;
      }
      .meta-dossier-fact-value {
        margin-top: 4px;
        color: #d8e6f3;
        font-size: 11px;
        line-height: 1.45;
      }
      .meta-dossier-kit-block .meta-kit {
        margin-top: 8px;
      }
      .meta-dossier-collection {
        display: flex;
        flex-direction: column;
        gap: 9px;
        align-self: start;
        border: 1px solid #31465b;
        background:
          linear-gradient(
            145deg,
            color-mix(in srgb, var(--region-primary) 8%, #0b1420),
            #080e16
          );
        padding: 18px;
      }
      .meta-dossier-status {
        color: #fff;
        font-size: 19px;
        letter-spacing: 1px;
      }
      .meta-dossier-focus-regions {
        margin-top: 2px;
        padding-bottom: 4px;
      }
      .meta-dossier-collection .meta-play,
      .meta-dossier-collection .meta-btn {
        width: 100%;
        text-align: center;
      }
      .meta-dossier-collection .meta-btn.active {
        border-color: var(--rift-gold);
        color: var(--rift-gold-bright);
      }
      .meta-dossier-sources {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        border-top: 1px solid #263a4d;
        padding-top: 10px;
        color: #6e8398;
        font-size: 8px;
        letter-spacing: 1px;
      }
      .meta-dossier-sources a {
        color: #a9c8e2;
        text-decoration: none;
      }
      .meta-dossier-sources a:hover {
        color: var(--rift-gold-bright);
      }
      .meta-dossier-verified {
        margin-left: auto;
        color: #52677b;
        white-space: nowrap;
      }
      @media (max-width: 900px) {
        .meta-dossier {
          padding: 10px;
        }
        .meta-dossier-panel {
          max-height: calc(100vh - 20px);
        }
        .meta-dossier-hero {
          grid-template-columns: 1fr;
        }
        .meta-dossier-art {
          min-height: 190px;
          border-right: 0;
          border-bottom: 1px solid #2b4054;
        }
        .meta-dossier-crest {
          width: 150px;
          height: 150px;
        }
        .meta-dossier-heading {
          padding: 30px 24px 22px;
        }
        .meta-dossier-body {
          grid-template-columns: 1fr;
          padding: 20px 18px 24px;
        }
        .meta-dossier-facts {
          grid-template-columns: 1fr;
        }
        .meta-dossier-verified {
          margin-left: 0;
        }
      }
      @media (max-width: 900px) {
        .meta {
          overflow: auto;
        }
        .meta-shell,
        .meta-body,
        .meta-sidebar,
        .meta-content,
        .meta-topbar {
          box-sizing: border-box;
        }
        .meta-shell {
          height: auto;
          min-height: 100%;
        }
        .meta-topbar {
          height: auto;
          min-height: 58px;
          flex-wrap: wrap;
          gap: 7px;
          padding: 8px 10px;
        }
        .meta-currency {
          gap: 4px;
          margin-left: 0;
        }
        .meta-currency-pill {
          padding: 4px 6px;
          font-size: 8px;
        }
        .meta-topbar-profile {
          padding-left: 7px;
          font-size: 0;
        }
        .meta-topbar-profile-mark {
          font-size: 9px;
        }
        .meta-admin-hint {
          display: none;
        }
        .meta-body {
          width: 100%;
          max-width: 100%;
          min-height: 0;
          overflow: hidden;
          flex-direction: column;
        }
        .meta-sidebar {
          width: 100%;
          max-width: 100%;
          min-width: 0;
          overflow: hidden;
          border-right: 0;
          border-bottom: 1px solid var(--rift-line);
          padding: 10px 12px;
          gap: 8px;
        }
        .meta-sidebar-champion {
          align-self: stretch;
          max-width: 100%;
        }
        .meta-nav {
          width: 100%;
          min-width: 0;
          max-width: 100%;
          flex-direction: row;
          overflow-x: auto;
          gap: 4px;
          padding-bottom: 2px;
        }
        .meta-nav-item {
          flex: none;
          white-space: nowrap;
          padding: 7px 9px;
        }
        .meta-sidebar-footer {
          display: none;
        }
        .meta-content {
          width: 100%;
          flex: none;
          min-width: 0;
          overflow-x: hidden;
          overflow-y: visible;
          padding: 18px 13px 40px;
        }
        .meta-page {
          width: 100%;
          max-width: 100%;
          min-width: 0;
          gap: 14px;
        }
        .meta-page > * {
          min-width: 0;
        }
        .meta-filter-row,
        .meta-search-row {
          flex-wrap: wrap;
          min-width: 0;
        }
        .meta-champion-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .meta-region-head .meta-region-name,
        .meta-region-head .meta-region-blurb {
          min-width: 0;
        }
        .meta-hero-name {
          font-size: 38px;
        }
        .meta-dossier-heading {
          padding-right: 42px;
        }
      }
      @media (max-width: 600px) {
        .meta-topbar-profile {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .meta-champion-crest,
        .meta-champion-card::before,
        .meta-dossier-panel {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
