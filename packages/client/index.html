<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rift Survivors</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      canvas {
        image-rendering: pixelated;
      }
      .levelup {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: rgba(0, 0, 0, 0.7);
        z-index: 10;
      }
      .levelup-title {
        color: #ffcc44;
        font-family: monospace;
        font-size: 22px;
        letter-spacing: 2px;
      }
      .levelup-row {
        display: flex;
        gap: 12px;
      }
      .levelup-card {
        background: #16202e;
        border: 2px solid #3a5a7a;
        color: #fff;
        font-family: monospace;
        font-size: 14px;
        padding: 18px 20px;
        cursor: pointer;
        min-width: 130px;
      }
      .levelup-card:hover {
        border-color: #ffcc44;
      }
      .charselect {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: rgba(0, 0, 0, 0.8);
        z-index: 20;
      }
      .charselect-title {
        color: #ffcc44;
        font-family: monospace;
        font-size: 20px;
        letter-spacing: 2px;
      }
      .charselect-row {
        display: flex;
        gap: 14px;
      }
      .charselect-card {
        background: #16202e;
        border: 2px solid #3a5a7a;
        color: #fff;
        font-family: monospace;
        font-size: 16px;
        padding: 24px 28px;
        cursor: pointer;
      }
      .charselect-card:hover {
        border-color: #ffcc44;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
