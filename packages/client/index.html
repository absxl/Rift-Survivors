<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rift Survivors</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      canvas {
        image-rendering: pixelated;
      }
      .levelup {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: rgba(0, 0, 0, 0.7);
        z-index: 10;
      }
      .levelup-title {
        color: #ffcc44;
        font-family: monospace;
        font-size: 22px;
        letter-spacing: 2px;
      }
      .levelup-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      .levelup-card {
        background: #16202e;
        border: 2px solid #3a5a7a;
        color: #fff;
        font-family: monospace;
        font-size: 14px;
        padding: 18px 20px;
        cursor: pointer;
        min-width: 130px;
      }
      .levelup-card:hover {
        border-color: #ffcc44;
      }
      .levelup-actions {
        display: flex;
        gap: 10px;
      }
      .levelup-action {
        background: #101a26;
        border: 2px solid #2a3a4a;
        color: #cfe0f0;
        font-family: monospace;
        font-size: 12px;
        letter-spacing: 1px;
        padding: 8px 12px;
        cursor: pointer;
      }
      .levelup-action:hover:not(:disabled) {
        border-color: #ffcc44;
      }
      .levelup-action:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .levelup-card.banish-target {
        border-color: #cc4444;
      }
      .levelup-card.banish-target:hover {
        border-color: #ff6666;
      }
      .levelup-card.training {
        border-color: #3fa9ff;
        color: #bfe3ff;
      }
      .levelup-hint {
        color: #7f93b0;
        font-family: monospace;
        font-size: 11px;
        letter-spacing: 1px;
      }
      .charselect {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: rgba(0, 0, 0, 0.8);
        z-index: 20;
      }
      .charselect-title {
        color: #ffcc44;
        font-family: monospace;
        font-size: 20px;
        letter-spacing: 2px;
      }
      .charselect-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 90vw;
      }
      .charselect-card {
        background: #16202e;
        border: 2px solid #3a5a7a;
        color: #fff;
        font-family: monospace;
        font-size: 16px;
        padding: 24px 28px;
        cursor: pointer;
      }
      .charselect-card:hover {
        border-color: #ffcc44;
      }
      .charselect-name {
        font-size: 16px;
        color: #fff;
      }
      .charselect-ability {
        font-size: 10px;
        color: #8ab0c0;
        margin-top: 4px;
      }
      .meta {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #0d0f1a;
        color: #fff;
        font-family: monospace;
        z-index: 30;
        overflow: auto;
        padding: 20px;
      }
      .meta-header {
        font-size: 20px;
        color: #ffcc44;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }
      .meta-section {
        font-size: 13px;
        color: #7fb0e0;
        letter-spacing: 1px;
        margin-top: 8px;
      }
      .meta-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .meta-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .meta-label {
        min-width: 230px;
        font-size: 12px;
      }
      .meta-btn {
        background: #16202e;
        border: 2px solid #3a5a7a;
        color: #fff;
        font-family: monospace;
        font-size: 12px;
        padding: 4px 10px;
        cursor: pointer;
      }
      .meta-btn:hover:not(:disabled) {
        border-color: #ffcc44;
      }
      .meta-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .meta-chip {
        font-size: 11px;
        padding: 3px 8px;
        border: 1px solid #3a5a7a;
        color: #5a6a7a;
      }
      .meta-chip.on {
        border-color: #44ff66;
        color: #44ff66;
      }
      .meta-play {
        margin-top: 14px;
        background: #16203a;
        border: 2px solid #44aa66;
        color: #fff;
        font-family: monospace;
        font-size: 18px;
        padding: 10px 40px;
        cursor: pointer;
      }
      .meta-play:hover {
        border-color: #ffcc44;
      }
      .run-end {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        font-family: monospace;
        z-index: 40;
      }
      .run-end-title {
        font-size: 26px;
        color: #ff4444;
      }
      .run-end-stats {
        font-size: 14px;
        white-space: pre-line;
        text-align: center;
      }
      .lobby {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0d0f1a;
        color: #fff;
        font-family: monospace;
        z-index: 30;
      }
      .lobby-title {
        font-size: 22px;
        color: #ffcc44;
        letter-spacing: 2px;
      }
      .lobby-input {
        background: #16202e;
        border: 2px solid #3a5a7a;
        color: #fff;
        font-family: monospace;
        font-size: 14px;
        padding: 6px 10px;
        width: 160px;
        text-align: center;
      }
      .lobby-status {
        font-size: 14px;
        color: #7fb0e0;
        min-height: 16px;
      }
      .name-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0d0f1a;
        color: #fff;
        font-family: monospace;
        z-index: 30;
      }
      .pause {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
        font-family: monospace;
        z-index: 45;
      }
      .pause-title {
        font-size: 26px;
        color: #ffcc44;
        letter-spacing: 2px;
        margin-bottom: 8px;
      }
      .pause-hint {
        font-size: 11px;
        color: #8ab0c0;
        margin-top: 10px;
      }
      .meta-hint {
        font-size: 11px;
        color: #7f93b0;
        margin-top: 6px;
        letter-spacing: 1px;
      }
      .debug-overlay {
        position: fixed;
        top: 6px;
        left: 6px;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.7);
        color: #7fffd4;
        font: 11px monospace;
        z-index: 50;
        pointer-events: none;
      }
      .connection-lost {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(24, 0, 0, 0.9);
        color: #fff;
        font-family: monospace;
        z-index: 60;
      }
      .banner {
        position: fixed;
        top: 22%;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 20px;
        color: #ffcc44;
        background: rgba(10, 14, 22, 0.88);
        border: 2px solid #ffcc44;
        font-family: monospace;
        font-size: 22px;
        letter-spacing: 4px;
        z-index: 25;
        pointer-events: none;
        opacity: 0;
      }
      .banner-show {
        animation: banner-pop 2.6s ease-out forwards;
      }
      .screen-flash {
        position: fixed;
        inset: 0;
        background: #ffffff;
        opacity: 0;
        pointer-events: none;
        z-index: 55;
      }
      .screen-flash.flash-on {
        animation: screen-flash 0.35s ease-out;
      }
      @keyframes screen-flash {
        0% { opacity: 0.75; }
        100% { opacity: 0; }
      }
      @keyframes banner-pop {
        0% { opacity: 0; transform: translateX(-50%) scale(0.85); }
        10% { opacity: 1; transform: translateX(-50%) scale(1.06); }
        20% { transform: translateX(-50%) scale(1); }
        75% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
